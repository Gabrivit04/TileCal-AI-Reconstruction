[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilecal-ai-reconstruction"
version = "0.1.0"
description = "Hardware-aware ML reconstruction blueprint for ATLAS TileCal Phase-II"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GSoC Candidate" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "black>=24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
