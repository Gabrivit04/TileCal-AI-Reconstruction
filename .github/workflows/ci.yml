name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Unit tests
        run: pytest
      - name: Smoke train loop
        run: |
          python - <<'PY'
          import torch
          from tilecal_ai.models.networks import TinyMLP
          from tilecal_ai.training.losses import AmplitudeTimeLoss
          x = torch.randn(8, 7)
          y = torch.randn(8, 2)
          m = TinyMLP(7)
          loss = AmplitudeTimeLoss()(m(x), y)
          loss.backward()
          print(float(loss))
          PY
